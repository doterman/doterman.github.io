<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI工具聚合导航站</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js" crossorigin>
</head>
<body>
    <!-- Mobile menu overlay -->
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <!-- Main container -->
    <div class="app-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-content">
                <!-- Logo -->
                <div class="logo-section">
                    <div class="logo">
                        <img src="imgs/modern_ai_chip_logo_design_icon.png" alt="AI Tools Logo" class="logo-img">
                        <span class="logo-text">AI工具导航</span>
                    </div>
                </div>

                <!-- Navigation -->
                <nav class="sidebar-nav">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="#" class="nav-link active" data-category="all">
                                <svg class="nav-icon" data-lucide="grid"></svg>
                                <span class="nav-text">全部工具</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-category="text">
                                <svg class="nav-icon" data-lucide="edit"></svg>
                                <span class="nav-text">文本生成</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-category="image">
                                <svg class="nav-icon" data-lucide="image"></svg>
                                <span class="nav-text">图像处理</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-category="audio">
                                <svg class="nav-icon" data-lucide="mic"></svg>
                                <span class="nav-text">音频视频</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-category="code">
                                <svg class="nav-icon" data-lucide="code"></svg>
                                <span class="nav-text">代码工具</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-category="data">
                                <svg class="nav-icon" data-lucide="bar-chart"></svg>
                                <span class="nav-text">数据分析</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-category="ml">
                                <svg class="nav-icon" data-lucide="brain"></svg>
                                <span class="nav-text">机器学习</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-category="research">
                                <svg class="nav-icon" data-lucide="search"></svg>
                                <span class="nav-text">研究工具</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <button id="mobile-menu-btn" class="mobile-menu-btn">
                    <svg data-lucide="menu"></svg>
                </button>
                <div class="search-section">
                    <div class="search-container">
                        <svg class="search-icon" data-lucide="search"></svg>
                        <input type="text" id="search-input" class="search-input" placeholder="搜索工具名称或标签...">
                    </div>
                </div>
            </header>

            <!-- Tools grid -->
            <div class="content-wrapper">
                <div class="section-header">
                    <h1 class="page-title">发现AI工具</h1>
                    <div class="results-info">
                        <span id="results-count">显示所有工具</span>
                    </div>
                </div>

                <div id="tools-grid" class="tools-grid">
                    <!-- Tools will be dynamically loaded here -->
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
    <script src="script.js"></script>
</body>
</html>
